<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
    <title>Dog Breed Recognition</title>
  </head>
  <body>
    <div class="container py-5">
      <header class="text-white text-center">
        <h1 class="display-4">Dog Breed Recognition</h1>
        <p class="lead mb-5">Wonder what dog is this? Drop an image and find out!</p>
      </header>

      <div class="row py-4">
        <div class="col-lg-6 mx-auto">
          <form enctype="multipart/form-data" id="predict-form">
            <div class="input-group mb-3 px-2 py-2 rounded-pill bg-white shadow-sm">
              <input class="form-control border-0" id="upload" name="file" type="file">
              <label class="font-weight-light text-muted" for="upload" id="upload-label">Choose file</label>
              <div class="input-group-append">
                <label class="btn btn-light m-0 rounded-pill px-4" for="upload">
                  <small class="text-uppercase font-weight-bold text-muted">Choose file</small>
                </label>
              </div>
            </div>

            <p class="font-italic text-white text-center">The image uploaded will be rendered inside the box below.</p>
            <div class="image-area mt-4">
              <img alt="" class="img-fluid rounded shadow-sm mx-auto d-block" id="imageResult" name="imageResult" src="#">
            </div>

            <div class="container">
              <div class="row">
                <div class="col text-center">
                  <input class="btn btn-primary my-3" type="submit" value="Predict">
                </div>
              </div>
            </div>
          </form>
          <p class="text-white text-center mt-2" id="prediction-result"></p>
        </div>
      </div>
    </div>
    <script crossorigin="anonymous" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script crossorigin="anonymous" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
    <script src="/static/js/image_upload.js"></script>
  </body>
</html>
